<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Cedric's games</title>
    <link rel="stylesheet" href="../style.css" >

    <!-- firebase start ****************************************-->
    <!-- Firebase App (core Firebase SDK) is always required & must be listed 1st -->
    <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-app.js"></script>
    <!-- Add Firebase products that you want to use -->
    <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-analytics.js"></script>

    <script src="../setup.js"></script>
</head>

<body onload="authenticate()">
    
    <div class="container">
    <h1>Log in/ Sign up</h1>
    <br>
    <button onclick=' location.href="../index.html"'>Home</button>
    <br>
    <button onclick="popupLogin()">login/sign up with google</button>

    <form id="fruitForm">
      <p id="statusMessage"></p>
      <label for="name">Your Name</label>
      <input type="text" id="usrName" name="usrName" required />

      <label for="favoriteFruit">Your Age</label>
      <input type="text" id="usrAge" name="usrAge" required />
      <p id="ageError"></p>
      <button onclick="writeUsrData()" type="button">sign up</button>
    </form>

</div>
<script src="authenticate.js"></script>
</body>    
</html>
